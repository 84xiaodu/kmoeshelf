t{position:relative;border-radius:15px;overflow:hidden;aspect-ratio:var(--ratio,3/4);background:var(--art);border:1px solid #ffffff10}.art:before{content:attr(data-word);position:absolute;inset:auto 12px 14px;font:900 26px/.95 Georgia,serif;white-space:pre;color:white;text-shadow:0 2px 12px #000}.reason{position:absolute;top:9px;left:9px;padding:5px 7px;border-radius:7px;background:#111c;color:#fff;font-size:10px;backdrop-filter:blur(5px)}.tile h2{font-size:14px;margin:9px 2px 3px}.tile p{margin:0 2px;color:var(--muted);font-size:11px}.tile:hover .art{outline:2px solid var(--lime);outline-offset:2px}.drawer{position:fixed;top:0;right:0;width:min(420px,100%);height:100vh;padding:28px;background:#20221d;border-left:1px solid var(--line);box-shadow:-30px 0 80px #0008;transform:translateX(102%);transition:.25s;z-index:4}.drawer.open{transform:none}.drawer button.close{float:right;border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer}.drawer-cover{height:280px;border-radius:20px;margin-top:42px;background:linear-gradient(145deg,#e3b163,#b73d36 55%,#312332)}.drawer h2{font-size:32px;margin:22px 0 8px}.drawer p{color:var(--muted);line-height:1.7}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:var(--lime);color:#171812;font-weight:850;cursor:pointer}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:18px 15px 60px}.intro{display:block}.intro p{margin-top:12px}.wall{columns:2}.top{position:sticky;top:0;z-index:2;background:#111210;padding:8px 0}.tile h2{font-size:13px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">Kmoe<i>Shelf</i></div><p>你的漫画发现与自动书架</p><nav><a class="active" href="#">发现</a><a href="#">我的书架</a><a href="#">下载任务</a><a href="#">活动记录</a><a href="#">设置</a></nav><div class="queue"><strong>3</strong><span>正在下载 · 7 个等待</span></div></aside><main class="main"><header class="top"><input class="search" placeholder="搜索 9,428 部漫画…"><div class="avatar">Z</div></header><section class="intro"><div><div style="color:var(--lime);font-size:12px;letter-spacing:.15em">DISCOVER</div><h1>下一本，<br>从这里开始。</h1></div><p>站内热门、你的作者偏好与 Bangumi 高分榜统一在一面封面墙中；推荐理由始终透明。</p></section><div class="filters"><button class="filter active" data-f="all">混合推荐</button><button class="filter" data-f="kmoe">Kmoe 热门</button><button class="filter" data-f="author">同作者</button><button class="filter" data-f="bangumi">Bangumi 高分</button><button class="filter" data-f="recent">近期更新</button></div><section class="wall" id="wall">

</section></main></div><aside class="drawer" id="drawer"><button class="close" onclick="drawer.classList.remove('open')">×</button><div class="drawer-cover"></div><h2 id="dt"></h2><div id="dm" style="color:var(--lime)"></div><p id="dr"></p><p>先在 Kmoe 中匹配稳定作品 ID，再允许创建订阅；外部榜单只提供评分和发现线索。</p><button class="primary" onclick="this.textContent='✓ 已加入书架'">加入书架</button></aside><script>const fs=[...document.querySelectorAll('.filter')],tiles=[...document.querySelectorAll('.tile')];fs.forEach(b=>b.onclick=()=>{fs.forEach(x=>x.classList.remove('active'));b.classList.add('active');tiles.forEach(t=>t.hidden=b.dataset.f!=='all'&&!t.dataset.f.split(' ').includes(b.dataset.f))});function openBook(t,a,r){dt.textContent=t;dm.textContent=a;dr.textContent='推荐理由：'+r;drawer.classList.add('open')}</script></body></html>
