<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KmoeShelf · 温暖编辑书架</title>
<style>
*{box-sizing:border-box} :root{--bg:#f5f1e8;--paper:#fffdf8;--ink:#211d19;--muted:#746d64;--red:#c44832;--line:#ddd4c7} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC",system-ui,sans-serif} button,input{font:inherit}.shell{display:grid;grid-template-columns:88px 1fr;min-height:100vh}.rail{position:sticky;top:0;height:100vh;background:#211f1b;color:#eee8dd;padding:24px 14px;display:flex;flex-direction:column;align-items:center}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--red);font:800 24px Georgia}.rail nav{display:grid;gap:14px;margin-top:48px}.nav{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:15px;background:transparent;color:#9d978e;cursor:pointer;font-size:21px}.nav.active,.nav:hover{background:#37332d;color:#fff}.account{margin-top:auto;width:38px;height:38px;border-radius:50%;background:#655b50;display:grid;place-items:center}.main{min-width:0;padding:28px clamp(22px,4vw,64px) 70px}.top{display:flex;align-items:center;gap:18px;justify-content:space-between}.search{max-width:520px;flex:1;border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:13px 18px}.status{color:#4c765e;font-size:13px}.hero{margin-top:30px;display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center;padding:28px;border-radius:30px;background:#2e3127;color:#fbf7ee;overflow:hidden;position:relative}.hero:after{content:"荐";position:absolute;right:-20px;bottom:-75px;font:700 240px Georgia;color:#ffffff0a}.cover{aspect-ratio:3/4.2;border-radius:18px;background:linear-gradient(150deg,#d98a58,#7a2f37 52%,#18222b);box-shadow:0 20px 50px #0006;position:relative;overflow:hidden}.cover:before{content:"膽\A 大\A 黨";white-space:pre;position:absolute;inset:24px;color:#fff;font:800 42px/1.05 serif;text-shadow:0 2px 8px #0008}.hero-copy{position:relative;z-index:1}.kicker{font-size:12px;letter-spacing:.16em;color:#e5a17d}.hero h1{font:800 clamp(38px,5vw,72px)/1.02 Georgia,"Noto Serif SC",serif;margin:10px 0 15px}.hero p{max-width:650px;color:#c8c3b9;line-height:1.8}.actions{display:flex;gap:10px;margin-top:24px}.btn{border:0;border-radius:14px;padding:11px 17px;background:#eee8dc;color:#241f1a;font-weight:700;cursor:pointer}.btn.primary{background:var(--red);color:#fff}.section{margin-top:42px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section h2{margin:0;font:800 27px Georgia,"Noto Serif SC",serif}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:transparent;padding:8px 12px;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}.card{border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;padding:0}.poster{aspect-ratio:3/4.25;border-radius:18px;background:var(--art);position:relative;overflow:hidden;transition:.2s}.poster:after{content:attr(data-mark);position:absolute;inset:auto 12px 13px;color:#fff;font:800 28px/1.05 serif;text-shadow:0 2px 10px #000}.card:hover .poster{transform:translateY(-5px);box-shadow:0 15px 28px #3a2d2140}.card h3{margin:11px 0 5px;font-size:16px}.meta{color:var(--muted);font-size:12px}.badge{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:9px;background:#fffdebd9;color:#31291f;font-size:11px;font-weight:800}.toast{position:fixed;right:24px;bottom:24px;padding:13px 17px;border-radius:13px;background:#211f1b;color:#fff;box-shadow:0 10px 32px #0004;opacity:0;transform:translateY(12px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:720px){.shell{display:block}.rail{display:none}.main{padding:18px}.hero{grid-template-columns:110px 1fr;padding:18px;gap:18px}.hero h1{font-size:32px}.hero p{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.top .status{display:none}}
</style>
</head>
<body><div class="shell"><aside class="rail"><div class="logo">K</div><nav><button class="nav active" title="书架">▦</button><button class="nav" title="发现">⌕</button><button class="nav" title="下载">⇣</button><button class="nav" title="设置">⚙</button></nav><div class="account">Z</div></aside><main class="main"><header class="top"><input class="search" placeholder="搜索漫画、作者或书架…"><span class="status">● Kmoe 已连接</span></header><section class="hero"><div class="cover"></div><div class="hero-copy"><div class="kicker">今日编辑推荐 · KMOE 热门</div><h1>膽大黨</h1><p>幽灵、外星人与青春的高速碰撞。推荐会自动排除已订阅作品，也可以切换为“同作者发现”或 Bangumi 高分榜。</p><div class="actions"><button class="btn primary" onclick="subscribe(this)">＋ 加入书架</button><button class="btn" onclick="toast('已打开作品详情')">查看详情</button></div></div></section><section class="section"><div class="section-head"><div><h2>为你发现</h2><p>三种来源合并，但始终先确认 Kmoe 可搜索到</p></div><div class="tabs"><button class="tab active" data-source="all">全部</button><button class="tab" data-source="kmoe">Kmoe 热门</button><button class="tab" data-source="author">同作者</button><button class="tab" data-source="bangumi">Bangumi 高分</button></div></div><div class="grid" id="grid">
<button class="card" data-source="kmoe" onclick="toast('打开《古见同学是沟通鲁蛇。》')"><div class="poster" data-mark="古見" style="--art:linear-gradient(145deg,#efb3a1,#7d4d69 58%,#2d354c)"><span class="badge">站内热门</span></div><h3>古见同学是沟通鲁蛇。</h3><div class="meta">ODA TOMOHITO</div></button>
<button class="card" data-source="bangumi" onclick="toast('打开《剑风传奇》')"><div class="poster" data-mark="剑风" style="--art:linear-gradient(145deg,#9d9587,#282624 60%,#080808)"><span class="badge">Bangumi 9.3</span></div><h3>剑风传奇</h3><div class="meta">三浦建太郎</div></button>
<button class="card" data-source="author" onclick="toast('打开《路边的藤井》')"><div class="poster" data-mark="藤井" style="--art:linear-gradient(145deg,#b9d8ce,#f0c58d 60%,#9c6956)"><span class="badge">同作者发现</span></div><h3>路边的藤井</h3><div class="meta">锅仓夫</div></button>
<button class="card" data-source="kmoe" onclick="toast('打开《朱音落语》')"><div class="poster" data-mark="朱音" style="--art:linear-gradient(145deg,#f2be73,#c64235 55%,#4c2736)"><span class="badge">近期更新</span></div><h3>朱音落语</h3><div class="meta">末永裕树 · 马上鹰将</div></button>
<button class="card" data-source="bangumi" onclick="toast('打开《灌篮高手 完全版》')"><div class="poster" data-mark="灌篮" style="--art:linear-gradient(145deg,#f0eee6,#cc3c2f 62%,#222)"><span class="badge">Bangumi 9.4</span></div><h3>灌篮高手 完全版</h3><div class="meta">井上雄彦</div></button>
<button class="card" data-source="author" onclick="toast('打开《愚者之夜》')"><div class="poster" data-mark="愚者" style="--art:linear-gradient(145deg,#b7c1aa,#334838 60%,#18221d)"><span class="badge">相似偏好</span></div><h3>愚者之夜</h3><div class="meta">安田佳澄</div></button>
</div></section></main></div><div class="toast" id="toast"></div><script>const tabs=[...document.querySelectorAll('.tab')],cards=[...document.querySelectorAll('.card')];tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');cards.forEach(c=>c.hidden=t.dataset.source!=='all'&&c.dataset.source!==t.dataset.source)});function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function subscribe(b){b.textContent='✓ 已加入书架';b.disabled=true;toast('订阅已创建')}</script></body></html>
