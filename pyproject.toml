[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kmoe-subscriptions"
version = "0.3.0"
description = "Self-hosted Kmoe manga subscription and download service"
authors = [{ name = "84xiaodu" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "apscheduler>=3.11,<4",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[project.scripts]
kmoeshelf-mcp = "kmoe_subscriptions.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kmoe_subscriptions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
